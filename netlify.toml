# Netlify build configuration for the Next.js storefront.
# Netlify auto-detects Next.js and installs its Next runtime plugin; this file
# just pins the build command and a Node version compatible with Next.js 16.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Scripts del agente de etiquetas (PC de la impresora, Windows). Se sirven como
# texto para que "irm … | iex" de PowerShell los lea, y fuera de Google: no son
# páginas de la tienda.
[[headers]]
  for = "/herramientas/etiquetas/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
